<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link type="image/svg+xml" href="/favicon.svg" rel="icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interactive-rating-component</title>
  </head>
  <body class="font-overpass grid min-h-screen place-items-center bg-gray-950 text-[15px]">
    <main class="w-[90%] max-w-96">
      <!--RATING LAYOUT-->
      <section
        id="rating-layout"
        class="flex flex-col gap-5 rounded-3xl bg-[radial-gradient(circle_at_top,#374151,#111827)] p-5"
      >
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-gray-700">
          <img src="./src/assets/img/icon-star.svg" alt="" />
        </div>
        <h1 class="text-2xl font-bold text-white">How did we do?</h1>
        <p class="text-gray-500">
          Please let us know how we did with your support request. All feedback is appreciated to help us improve our
          offering!
        </p>
        <form id="form">
          <div class="flex justify-between">
            <button
              class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full bg-gray-700 font-bold text-gray-500 hover:bg-white"
              data-rating="1"
              type="button"
              aria-pressed="false"
            >
              1
            </button>
            <button
              class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full bg-gray-700 font-bold text-gray-500 hover:bg-white"
              data-rating="2"
              type="button"
              aria-pressed="false"
            >
              2
            </button>
            <button
              class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full bg-gray-700 font-bold text-gray-500 hover:bg-white"
              data-rating="3"
              type="button"
              aria-pressed="false"
            >
              3
            </button>
            <button
              class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full bg-gray-700 font-bold text-gray-500 hover:bg-white"
              data-rating="4"
              type="button"
              aria-pressed="false"
            >
              4
            </button>
            <button
              class="flex h-12 w-12 cursor-pointer items-center justify-center rounded-full bg-gray-700 font-bold text-gray-500 hover:bg-white"
              data-rating="5"
              type="button"
              aria-pressed="false"
            >
              5
            </button>
          </div>
          <button
            class="mt-5 w-full cursor-pointer rounded-full bg-orange-500 p-3 font-bold tracking-widest uppercase transition hover:bg-white"
            type="submit"
          >
            submit
          </button>
        </form>
      </section>
      <!--GRATITUDE LAYOUT-->
      <section
        id="gratitude-layout"
        class="flex flex-col gap-5 rounded-3xl bg-[radial-gradient(circle_at_top,#374151,#111827)] p-5 text-center"
        hidden
      >
        <img class="mx-auto w-50" src="./src/assets/img/illustration-thank-you.svg" alt="Thank you" />
        <p id="rating-selected" class="mx-auto rounded-full bg-gray-700 px-8 py-2 text-orange-500">
          You selected 0 out of 5
        </p>
        <h2 class="text-2xl font-bold text-white">Thank you!</h2>
        <p class="text-gray-500">
          We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in
          touch!
        </p>
      </section>
    </main>
    <script src="/src/main.js" type="module"></script>
  </body>
</html>
